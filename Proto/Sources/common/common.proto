//抽卡活动
message HeroGachaActivityInfo{
  //通用活动字段
  int32 ActivitySubType = 1;//活动子类型 1：武将抽卡 2：荒兽抽卡 3：武魂抽卡 4：鼎见万象
  repeated GiftInfo GiftList = 2;//礼包表
  repeated MissionInfo MissionList = 3;//任务表
  int64 RankingID = 4;//排行榜ID
  map<int64, uint64> GachaRecordUID = 5;//抽卡记录ID key:配置ID value:抽卡记录UID
  int64  GachaPoint = 6;//抽卡排行榜积分
  int32 Anonymous = 7; //是否匿名 0 不匿名  1 匿名
  int64 GiftGroupID = 8;//礼包组id
  int64 MissionGroupID = 9;//任务组id
  int64 Progress = 10;//进度
  map<int64, int32> ProgressRewards = 11;//进度奖励
  //特殊功能字段
  int64 HeroTeamID = 12;//英雄抽卡活动：当前选择的角色组配置ID
  int32 HeroGemChooseID = 13;//武魂抽卡活动：选择的ID 1：指定武魂1 2：指定武魂2 3：随机武魂
  repeated int64 HeroGemRandomChoose = 14; //武魂抽卡活动：随机武魂选择
  int64 HeroGemConfigID = 15;//武魂抽卡活动：当前配置ID
  map<uint64, bool> GetItemRecord = 16;//鼎见万象活动：抽到的道具记录
  int64 HeroGemStartTime = 17;//武魂抽卡活动：当期开始时间
  int64 HeroGemEndTime = 18;//武魂抽卡活动：当期结束时间
}

