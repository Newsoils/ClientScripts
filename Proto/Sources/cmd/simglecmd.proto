//通行证信息
message UserPassport {
  uint64 PassportUID = 1; //PassportUID
  int64 PassportID = 2; //PassportID //通行证ID
  int64 Score = 3; //积分(只有积分型通行证使用)
  int32 BuyAdvance = 4; //是否已购买高级通行证 0 未购买 1 已购买
  int64 NormalRewardFlag = 5; //普通奖励领取情况
  int64 AdvanceRewardFlag = 6; //高级奖励领取情况
  int64 EndTime = 7; //通行证结束时间
  int64 ModuleType = 8; //所属模块ID 15 活动
  int64 ModuleID = 9; //所属功能ID(活动UID)
  int32 BuyMiddle = 10; //是否已购买中级通行证 0 未购买 1 已购买
  int64 MiddleRewardFlag = 11; //中级奖励领取情况
}

