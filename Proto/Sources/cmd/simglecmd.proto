  int64 LuckyItem = 2; //幸运小物ID
  int64 FoodItem = 3; //便当ID
}

message CatTravelInfo {
  int32 Destination = 1; //目的地
  string Wears = 2; //出门时快照的穿戴 JSON：Dictionary<string,int>，key=槽位，value=服装id
}

message CatInfo {
  int32 Status = 1; //0 在家 1 出游
  string Wears = 2; //穿戴 JSON：Dictionary<string,int>，key=槽位，value=服装id
  CatTravelBagInfo Bag1 = 3;
  CatTravelBagInfo Bag2 = 4;
  CatTravelBagInfo Bag3 = 5;
  CatTravelInfo CurrentTravel = 6; //当前游历
}

// 场景照片（下发客户端）
message RolePhotoInfo {
  uint64 UID = 1;
  uint64 RoleID = 2;
  int32 MapID = 3;
  int32 PhotoConfigID = 4;
  string Wears = 5;
  int32 Status = 6; // 0 已保存 1 未处理
}

// 照片摘要（UID/地图/配置/穿戴）
message PhotoInfo {
  uint64 UID = 1;
  int32 MapID = 2;
  int32 PhotoConfigID = 3;
  string Wears = 4;
}

