//SEQ[1000,5000]
//登录前验证版本号请求
message UserVerifyVerReq {
  string resVer = 1; //资源版本号
  int32 serverid = 2; //服务器ID
  string clientVer = 3; //客户端版本号
  int32 platform = 4;//系统平台 1android 2ios
}

//登录前验证版本号响应
message UserVerifyVerRes {
  string resVer = 1; //资源版本号
  int32 serverid = 2; //服务器ID
  string clientVer = 3; //客户端版本号
  int32 platform = 4;//系统平台 1android 2ios
  common.Error error = 5; //错误码
}

//带token验证登录账号请求
message UserVerifyLoginReq {
  string  userID = 1;  //账号名
  string  token = 2;   //token
  int32   reconnect = 3; //是否重连 0 非重连 1重连
  int32 languageID = 4; //语言ID
  uint64 roleID = 5; //登陆的角色ID
  string resVer = 6; //资源版本号
  int32 serverid = 7; //服务器ID
  string clientVer = 8; //客户端版本号
  int32 platform = 9;//系统平台 1android 2ios
  int32  chatTranslateLanguageID = 10; //聊天翻译语言ID
  string deviceID = 11; //设备号
  int32 clientTp = 12; //0 IDE  1 debug内网  2 debug外网 3 RELEASE
  int32 guideStatus = 13; //是否新手引导完成 1 未完成 2 已完成
}

//带token验证登录账号响应
message UserVerifyLoginRes {
  int64 userID = 1;       //账号ID
  common.ServerRoleInfo RoleInfo = 2; //roleInfo
}

//心跳请求
message HeartBeatReq {
}

//心跳响应
message HeartBeatRes {
  int64 ts = 1;         //服务器时间戳
}

//心跳响应
message HeartBeatS2C {
  int64 ts = 1;         //服务器时间戳
}

//服务器登录请求
message ServerRoleLoginReq {
  string Token = 1; //Token
  string DeviceID = 2; //DeviceID
  string Platform = 3; //平台
  string RemoteAddr = 4; //IP
}

//服务器登录响应
message ServerRoleLoginRes {
  int64 UID = 1;                      //uid
  common.ServerRoleInfo RoleInfo = 2; //roleInfo
  int32 IsCreate = 3;//是否是创角 0否1是
  int64 ServerOpenTime = 4;//开服时间
  int64 MergeTime = 5;    //合并时间
}


