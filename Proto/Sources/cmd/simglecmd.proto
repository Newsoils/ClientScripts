//商店信息
message UserShop {
  uint64 ShopUID = 1; //商店UID
  int64 PshopID = 2; //父商店ID
  int64 ShopID = 3; //商店ID
  int32 FreeBuy = 4; //免费商品是否已购买
  int32 RefreshTimes = 5; //今日手动刷新次数
  repeated common.UserShopGoods Goodss = 6; //商品
  ShopAutoBuyRecord AutoBuyRecord = 7; //自动购买信息
