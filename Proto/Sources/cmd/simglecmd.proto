  int32 BuyAdvance = 1; //是否已购买高级通行证 0 未购买 1 已购买
  int64 Score = 2; //积分(只有积分型通行证使用)
  repeated common.ItemInfo Items = 3; //购买的道具信息
  string OrderUUID = 4; //支付订单号
  int32 IsEnough = 5; // 金币余额是否足够 1:足够 2:不足（微信平台使用）
