// 植物数据
message PlantInfo {
  uint64 UID = 1; //植物 uid
  string PotUID = 2; //花盆 uid
  int64 PlantSeed = 3; //植物/种子配置 id
  string VariantKey = 4; //变体 key
  int32 GrowStage = 5; //生长阶段1(大阶段)  1 生长期 2 成熟期 3 枯萎期
  int32 GrowStage2 = 6; //生长阶段2(小阶段) 1 种子期 2 发芽期 3 生长期 4 结果期
  int64 PlantTime = 7; //到下一阶段的倒计时(仅生长期使用,到下个小阶段需要的时间)
  int32 HarvestTime = 8; //剩余收获次数
  bool IsFertilize = 9; //是否已施肥
}

